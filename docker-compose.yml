services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/hangry_api:/home/app/webapp
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  frontend:
    image: node:18
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  test:
    image: node:18
    volumes:
      - ./frontend:/app
      - ./backend:/backend
      - frontend_node_modules:/app/node_modules
      - ./run-tests.sh:/run-tests.sh:ro
    working_dir: /app
    command: sh /run-tests.sh
    environment:
      - CI=true
    profiles:
      - test

volumes:
  frontend_node_modules:
